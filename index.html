    #results,#menu{display:none;pointer-events:auto;position:fixed;inset:0;background:#030a11df;place-items:center} #results.show,#menu.show{display:grid}.modes{display:grid;gap:12px;margin-top:14px}.mode{display:grid;gap:4px;text-align:left;background:#07111b;color:#f5fbff;border:1px solid #75dff9;border-radius:10px;padding:14px 16px;font:inherit;cursor:pointer}.mode:hover,.mode:focus-visible{background:#0d2a40;outline:none}.mode b{font-size:18px}.mode span{color:#9fc4d6}.panel{width:min(460px,92vw);background:#102235;border:1px solid #75dff9;border-radius:14px;padding:24px;box-shadow:0 10px 45px #000}.panel h1{margin:0 0 8px}.total{font-size:32px;color:#9af5b1;font-weight:800} #breakdown{max-height:300px;overflow:auto;margin:14px 0;color:#d8ebf4}button{background:#7ae6ff;color:#062031;border:0;border-radius:8px;padding:10px 15px;font-weight:800;font-size:15px;cursor:pointer}

  #credit{position:fixed;right:12px;bottom:10px;font-size:12px;color:#d8ebf4;background:#07111bcc;border:1px solid #5bc4dc55;border-radius:6px;padding:3px 9px;pointer-events:none}
  </style>
